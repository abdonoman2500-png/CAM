name: crosscall
description: CrossCall — Cross-Platform Video & Voice Calling Application (Android, iOS, Web)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  livekit_client: ^2.3.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_callkit_incoming: ^2.0.4+2
  permission_handler: ^11.3.1
  supabase_flutter: ^2.8.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
