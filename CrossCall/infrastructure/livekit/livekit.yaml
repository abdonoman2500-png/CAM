# CrossCall Self-Hosted LiveKit SFU Configuration
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  enable_loopback_candidate: false

redis:
  address: redis:6379
  password: ${REDIS_PASSWORD}

room:
  auto_create: false
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 50
  enable_remote_unmute: false

turn:
  enabled: true
  domain: ${TURN_DOMAIN}
  tls_port: 5349
  udp_port: 3478
  external_tls: true

logging:
  level: info
  pion_level: warn
