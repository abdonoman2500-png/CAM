services:
  postgres:
    image: postgres:16-alpine
    container_name: crosscall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crosscall}
      POSTGRES_USER: ${POSTGRES_USER:-crosscall_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crosscall_app} -d ${POSTGRES_DB:-crosscall}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crosscall_internal

  redis:
    image: redis:7-alpine
    container_name: crosscall-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crosscall_internal

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: crosscall-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crosscall_internal
      - crosscall_edge

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: crosscall-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_STATIC_SECRET:?TURN_STATIC_SECRET required}", "--external-ip=${EXTERNAL_IP:?EXTERNAL_IP required}"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crosscall-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - crosscall_internal
      - crosscall_edge

  nginx:
    image: nginx:1.27-alpine
    container_name: crosscall-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/crosscall.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - livekit
    networks:
      - crosscall_edge

volumes:
  postgres_data:
  redis_data:
  certbot_www:

networks:
  crosscall_internal:
    driver: bridge
    internal: true
  crosscall_edge:
    driver: bridge
